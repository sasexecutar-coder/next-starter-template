<script src="three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { DEFAULT_CONFIG, VIEWS, loadBrainAssets, createBrain, inspectGlb } from './brain-scene.js';

const KEY = 'home-brain-001-config';
const clone = (o) => JSON.parse(JSON.stringify(o));
const merge = (a, b) => { for (const k in b) a[k] = b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) ? merge(a[k] ?? {}, b[k]) : b[k]; return a; };
let cfg = clone(DEFAULT_CONFIG);
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved?.version === DEFAULT_CONFIG.version) cfg = merge(cfg, saved); } catch {}
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (prefersReduced) { cfg.motion.reducedMotion = true; cfg.motion.paused = true; }

const $ = (id) => document.getElementById(id);
const stage = $('stage'), panel = $('panel');

// ---------- panel schema ----------
const S = [
  ['Superfície', [
    ['range', 'surface.opacity', 'Opacidade', 0.2, 1, 0.01],
    ['range', 'surface.roughness', 'Rugosidade', 0.3, 1, 0.01],
    ['range', 'surface.sulcStrength', 'Leitura dos sulcos', 0, 1.6, 0.01],
    ['range', 'surface.subcortical', 'Tom cerebelo/tronco', 0, 1, 0.01],
    ['color', 'surface.crown', 'Giros'],
    ['color', 'surface.fundus', 'Sulcos'],
    ['check', 'hideBack', 'Ocultar verso no modo pontos'],
  ]],
  ['Partículas', [
    ['range', 'particles.density', 'Densidade', 0.05, 1, 0.01, (v) => Math.round(v * 42000).toLocaleString('pt-BR')],
    ['range', 'particles.sizePx', 'Raio (px)', 0.5, 4, 0.05],
    ['range', 'particles.opacity', 'Opacidade', 0.1, 1, 0.01],
    ['range', 'particles.crownMix', 'Laranja de marca nos giros', 0, 1, 0.01],
    ['range', 'particles.backFade', 'Esmaecer pontos do fundo', 0, 1, 0.01],
    ['color', 'particles.color', 'Cor dos pontos'],
    ['color', 'particles.crownColor', 'Cor nos giros'],
  ]],
  ['Linhas', [
    ['check', 'lines.visible', 'Graticulado visível'],
    ['range', 'lines.intensity', 'Intensidade', 0, 1, 0.01],
    ['range', 'lines.spacingUnits', 'Espaçamento (un.)', 0.08, 0.6, 0.01],
    ['range', 'lines.meridians', 'Meridianos', 6, 48, 1],
    ['range', 'lines.widthPx', 'Espessura (px)', 0.5, 2.5, 0.05],
    ['color', 'lines.color', 'Cor'],
  ]],
  ['Luz', [
    ['range', 'light.ambient', 'Ambiente', 0, 3, 0.01],
    ['range', 'light.key', 'Principal', 0, 4, 0.01],
    ['range', 'light.fill', 'Preenchimento', 0, 2, 0.01],
    ['range', 'light.keyAzimuthDeg', 'Azimute principal (°)', -180, 180, 1],
    ['range', 'light.keyElevationDeg', 'Elevação principal (°)', -10, 85, 1],
    ['range', 'light.depthFog', 'Profundidade (névoa)', 0, 1, 0.01],
    ['color', 'background', 'Fundo'],
  ]],
  ['Câmera', [
    ['views'],
    ['range', 'camera.distanceUnits', 'Distância (un.)', 4.6, 10, 0.05],
    ['range', 'camera.fovDeg', 'Campo de visão (°)', 20, 50, 1],
  ]],
  ['Movimento', [
    ['range', 'motion.speedRadPerSec', 'Velocidade (rad/s)', 0, 0.6, 0.01],
    ['check', 'motion.paused', 'Pausado'],
    ['check', 'motion.reducedMotion', 'Movimento reduzido'],
  ]],
];
const get = (p) => p.split('.').reduce((o, k) => o[k], cfg);
const set = (p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((o, k) => o[k], cfg)[last] = v; };
const VIEW_LABELS = { 'three-quarter': '3/4', 'lateral-right': 'Lateral D', 'lateral-left': 'Lateral E', frontal: 'Frontal', posterior: 'Posterior', superior: 'Superior' };
const inputs = {};
let uid = 0;
for (const [title, rows] of S) {
  const sec = document.createElement('section'); sec.innerHTML = `<h2>${title}</h2>`;
  for (const [kind, path, label, min, max, step, fmt] of rows) {
    if (kind === 'views') {
      const w = document.createElement('div'); w.className = 'views'; w.setAttribute('role', 'group'); w.setAttribute('aria-label', 'Vistas');
      for (const v in VIEWS) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.dataset.view = v; b.textContent = VIEW_LABELS[v]; b.onclick = () => goView(v); w.append(b); }
      sec.append(w); continue;
    }
    const id = 'c' + uid++, row = document.createElement('div'); row.className = 'row';
    if (kind === 'range') {
      row.innerHTML = `<label for="${id}">${label}</label><output for="${id}"></output><input id="${id}" type="range" min="${min}" max="${max}" step="${step}">`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      const show = () => { out.textContent = fmt ? fmt(+inp.value) : (+inp.value).toFixed(step >= 1 ? 0 : 2); };
      inp.oninput = () => { set(path, +inp.value); show(); changed(path); };
      inputs[path] = { sync: () => { inp.value = get(path); show(); } };
    } else if (kind === 'color') {
      row.innerHTML = `<label for="${id}">${label}</label><input id="${id}" type="color">`;
      const inp = row.querySelector('input'); inp.oninput = () => { set(path, inp.value); changed(path); };
      inputs[path] = { sync: () => { inp.value = get(path); } };
    } else {
      row.innerHTML = `<label for="${id}">${label}</label><input id="${id}" type="checkbox">`;
      const inp = row.querySelector('input'); inp.onchange = () => { set(path, inp.checked); changed(path); };
      inputs[path] = { sync: () => { inp.checked = get(path); } };
    }
    sec.append(row);
  }
  panel.append(sec);
}
const ex = document.createElement('section');
ex.innerHTML = `<h2>Entrega</h2>
  <div class="grid2">
    <a class="btn primary" href="assets/brain-surface.glb" download="brain-surface.glb">brain-surface.glb</a>
    <button class="btn primary" type="button" id="bVerify">Reabrir e verificar GLB</button>
    <button class="btn" type="button" id="bCfg">Config JSON</button>
    <button class="btn" type="button" id="bPoster">Pôster PNG</button>
    <a class="btn" href="assets/brain-particles.bin" download>Partículas .bin</a>
    <a class="btn" href="assets/brain-particles-attr.bin" download>Atributos .bin</a>
    <button class="btn" type="button" id="bScene">GLB da cena</button>
    <button class="btn" type="button" id="bDefaults">Restaurar padrões</button>
  </div>
  <p class="note">brain-surface.glb é o arquivo canônico do gerador. “GLB da cena” exporta o que está montado agora pelo GLTFExporter; a verificação reabre os dois a partir dos bytes. Procedência e shaders: <a href="PROVENIENCIA.md">PROVENIENCIA.md</a>, <a href="HANDOFF.md">HANDOFF.md</a>.</p>
  <pre class="report" id="report"></pre>`;
panel.append(ex);

// ---------- scene ----------
let brain, pivot, lights, fog, glbBytes = 0;
const rot = { x: 0, y: 0, tx: 0, ty: 0, anim: null };
function changed(path) {
  localStorage.setItem(KEY, JSON.stringify(cfg));
  if (path === 'motion.reducedMotion' && cfg.motion.reducedMotion) { cfg.motion.paused = true; inputs['motion.paused'].sync(); }
  applyAll();
}
function syncUI() {
  for (const k in inputs) inputs[k].sync();
  document.querySelectorAll('#modeSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === cfg.mode)));
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === cfg.camera.view)));
  $('bPause').setAttribute('aria-label', cfg.motion.paused ? 'Retomar rotação' : 'Pausar rotação');
  $('pauseIcon').innerHTML = cfg.motion.paused
    ? '<path d="M232.4 114.49 88.32 26.35a16 16 0 0 0-16.2-.3A15.86 15.86 0 0 0 64 39.87v176.26A15.94 15.94 0 0 0 80 232a16.07 16.07 0 0 0 8.36-2.35l144.04-88.14a15.81 15.81 0 0 0 0-27ZM80 215.94V40l143.83 88Z"/>'
    : '<path d="M200 32h-40a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16Zm0 176h-40V48h40ZM96 32H56a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h40a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16Zm0 176H56V48h40Z"/>';
}
function frameCamera() {
  const cam = stage._camera, w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  cam.fov = cfg.camera.fovDeg; cam.aspect = w / h;
  const fill = w < 620 ? 0.86 : 0.8, t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const fitW = 2.05 / (t * cam.aspect * fill), fitH = 1.55 / (t * 0.86);
  const d = Math.max(cfg.camera.distanceUnits, fitW, fitH);
  cam.position.set(0, 0.12, d); cam.lookAt(0, 0, 0); cam.near = 0.1; cam.far = 40; cam.updateProjectionMatrix();
  stage._controls.target.set(0, 0, 0);
  if (fog) { fog.near = d - 1.2; fog.far = d + 1.9 + (1 - cfg.light.depthFog) * 40; }
  return d;
}
function applyAll() {
  if (!brain) { syncUI(); return; }
  stage.style.setProperty('--stage-bg', cfg.background);
  stage._scene.fog = cfg.light.depthFog > 0 ? fog : null; fog.color.set(cfg.background);
  const d = frameCamera();
  brain.apply({ ...cfg, camera: { ...cfg.camera, distanceUnits: d } }, { dpr: stage._renderer.getPixelRatio() });
  const L = cfg.light, az = THREE.MathUtils.degToRad(L.keyAzimuthDeg), el = THREE.MathUtils.degToRad(L.keyElevationDeg);
  lights.hemi.intensity = L.ambient; lights.key.intensity = L.key; lights.fill.intensity = L.fill;
  lights.key.position.set(Math.sin(az) * Math.cos(el) * 8, Math.sin(el) * 8, Math.cos(az) * Math.cos(el) * 8);
  syncUI();
}
function goView(v, instant) {
  cfg.camera.view = v; localStorage.setItem(KEY, JSON.stringify(cfg));
  const [x, y] = VIEWS[v];
  const dy = ((y - rot.y + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  if (instant || cfg.motion.reducedMotion) { rot.x = x; rot.y = rot.y + dy; rot.anim = null; }
  else rot.anim = { fx: rot.x, fy: rot.y, x, y: rot.y + dy, t: 0 };
  syncUI();
}
function nudge(dir) { cfg.motion.paused = true; rot.anim = null; rot.y += dir * Math.PI / 8; changed('motion.paused'); }
function reset() { rot.anim = null; cfg.camera.view = DEFAULT_CONFIG.camera.view; cfg.camera.distanceUnits = DEFAULT_CONFIG.camera.distanceUnits; goView(cfg.camera.view, true); changed('camera'); }
function togglePause() { cfg.motion.paused = !cfg.motion.paused; changed('motion.paused'); }

document.querySelectorAll('#modeSeg button').forEach((b) => b.onclick = () => { cfg.mode = b.dataset.mode; changed('mode'); });
$('bLeft').onclick = () => nudge(-1); $('bRight').onclick = () => nudge(1);
$('bPause').onclick = togglePause; $('bReset').onclick = reset;
$('bIn').onclick = () => { cfg.camera.distanceUnits = Math.max(4.6, cfg.camera.distanceUnits - 0.4); changed('camera'); };
$('bOut').onclick = () => { cfg.camera.distanceUnits = Math.min(10, cfg.camera.distanceUnits + 0.4); changed('camera'); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  const inStage = e.target === stage;
  if (e.key === '1' || e.key === '2' || e.key === '3') { cfg.mode = ['surface', 'points', 'combined'][+e.key - 1]; changed('mode'); }
  else if (inStage && e.key === 'ArrowLeft') { e.preventDefault(); nudge(-1); }
  else if (inStage && e.key === 'ArrowRight') { e.preventDefault(); nudge(1); }
  else if (inStage && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); togglePause(); }
  else if (inStage && (e.key === 'r' || e.key === 'R')) reset();
});
// Drag: horizontal → yaw; vertical → pitch (mouse/pen only). touch-action: pan-y keeps vertical page scroll on mobile.
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary || e.button !== 0) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, type: e.pointerType }; rot.anim = null;
  stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  if (!cfg.motion.paused) { cfg.motion.paused = true; changed('motion.paused'); }
});
stage.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  rot.y += (e.clientX - drag.x) * 0.008;
  if (drag.type !== 'touch') rot.x = THREE.MathUtils.clamp(rot.x + (e.clientY - drag.y) * 0.004, -0.6, 1.5);
  drag.x = e.clientX; drag.y = e.clientY;
});
const end = () => { drag = null; stage.classList.remove('dragging'); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => stage.addEventListener(t, end));

// Exports
const download = (blob, name) => { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
$('bCfg').onclick = () => download(new Blob([JSON.stringify({ id: 'HOME-BRAIN-001', units: { distance: 'scene units (1 un. ≈ 45.57 mm)', angles: 'deg', speed: 'rad/s', size: 'CSS px at default distance' }, ...cfg }, null, 2)], { type: 'application/json' }), 'brain-visual-config.json');
$('bPoster').onclick = () => stage._renderer.domElement.toBlob((b) => download(b, 'brain-poster.png'), 'image/png');
$('bScene').onclick = () => stage._runExport('glb');
$('bDefaults').onclick = () => { cfg = clone(DEFAULT_CONFIG); localStorage.setItem(KEY, JSON.stringify(cfg)); goView(cfg.camera.view, true); applyAll(); };
const fmtReport = (title, r) => `${title}\n${r.bytes.toLocaleString('pt-BR')} bytes · ${r.generator || '—'}\n` +
  r.meshes.map((m) => m.primitives.map((p) => `  ${m.name.padEnd(13)} ${p.mode}  v ${p.vertices.toLocaleString('pt-BR')}  tri ${p.triangles.toLocaleString('pt-BR')}  [${p.attributes.join(', ')}] ${p.material ?? ''}`).join('\n')).join('\n') +
  `\n  total: ${r.totals.meshes} malhas · ${r.totals.triangles.toLocaleString('pt-BR')} triângulos · ${r.allTriangles ? '✓ todas TRIANGLES' : '✗ há primitivas não triangulares'}`;
$('bVerify').onclick = async () => {
  const out = $('report'); out.textContent = 'Verificando…';
  try {
    const canon = inspectGlb(await (await fetch('assets/brain-surface.glb', { cache: 'no-store' })).arrayBuffer());
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const sceneBuf = await new GLTFExporter().parseAsync(stage._object, { binary: true });
    const live = inspectGlb(sceneBuf);
    out.textContent = fmtReport('assets/brain-surface.glb (canônico)', canon) + '\n\n' + fmtReport('GLB exportado da cena (GLTFExporter)', live);
    window.__glbReport = { canon, live };
  } catch (err) { out.textContent = 'Falha: ' + err.message; }
};

// FPS + rotation loop
let last = 0, frames = 0, fpsT = 0;
function tick(t) {
  requestAnimationFrame(tick);
  const dt = last ? Math.min((t - last) / 1000, 0.05) : 0; last = t;
  if (rot.anim) {
    rot.anim.t = Math.min(1, rot.anim.t + dt / 0.6); const e = 1 - Math.pow(1 - rot.anim.t, 3);
    rot.x = rot.anim.fx + (rot.anim.x - rot.anim.fx) * e; rot.y = rot.anim.fy + (rot.anim.y - rot.anim.fy) * e;
    if (rot.anim.t >= 1) rot.anim = null;
  } else if (!cfg.motion.paused && !cfg.motion.reducedMotion && !drag && !document.hidden) rot.y += dt * cfg.motion.speedRadPerSec;
  if (pivot) { pivot.rotation.set(rot.x, rot.y, 0); }
  frames++; if (t - fpsT > 1000) { $('sFps').textContent = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
  $('sMotion').textContent = drag ? 'arrastando' : rot.anim ? 'transição' : cfg.motion.paused || cfg.motion.reducedMotion ? 'parado' : 'girando';
  stage.dataset.angle = rot.y.toFixed(4);
}

syncUI();
try {
  const { THREE: T } = await stage.ready;
  const assets = await loadBrainAssets('assets/');
  glbBytes = assets.glb.byteLength;
  brain = createBrain(assets);
  stage.shadowRoot.querySelector('.note').style.display = 'none';
  stage.shadowRoot.querySelector('.toolbar').style.display = 'none';
  stage._controls.disconnect(); stage._renderer.domElement.style.touchAction = 'pan-y';
  stage._renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage._scene.children.filter((o) => o.isLight).forEach((l) => stage._scene.remove(l));
  lights = { hemi: new THREE.HemisphereLight(0xffffff, 0xe9e7e3, 1), key: new THREE.DirectionalLight(0xffffff, 1.7), fill: new THREE.DirectionalLight(0xfff4ea, 0.5) };
  lights.fill.position.set(-6, -2, -5); stage._scene.add(lights.hemi, lights.key, lights.fill);
  fog = new THREE.Fog(0xffffff, 5, 9);
  stage.setObject(brain.surface);           // stage owns export of the named surface group
  stage._ground.visible = false;
  brain.surface.traverse((o) => { o.castShadow = false; o.receiveShadow = false; });
  stage._renderer.shadowMap.enabled = false;
  pivot = brain.root; stage._scene.add(pivot); pivot.add(brain.surface);
  goView(cfg.camera.view, true);
  new ResizeObserver(() => applyAll()).observe(stage);
  applyAll();
  const st = brain.stats();
  $('sTri').textContent = st.triangles.toLocaleString('pt-BR'); $('sPts').textContent = st.particles.toLocaleString('pt-BR');
  $('sBytes').textContent = (glbBytes / 1048576).toFixed(1) + ' MB';
  setTimeout(() => $('poster').classList.add('hide'), 120);
  requestAnimationFrame(tick);
} catch (err) {
  $('err').style.display = 'block'; $('err').textContent = 'WebGL ou recursos indisponíveis — exibindo o pôster. ' + (err?.message || err);
}
</script>
</body>
</html>
